<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sorting</title>
<meta name="description" content="A very old hat, in four movements.">
<meta name="theme-color" content="#120807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Sorting">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236E1219'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23C9A227' stroke-width='1.5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia' font-size='28' fill='%23F0E2C4'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#120807; --ink-2:#1C0D0B; --ink-3:#2C1612;
  --candle:#D4A84B; --candle-dim:#8A6A32;
  --parch:#F0E2C4; --parch-deep:#E4D2A6; --dim:#B39B72;
  --wax:#6E1219; --wax-lit:#8F1C24;
  --gold:#C9A227; --gold-soft:rgba(201,162,39,.38);
  --house:#C9A227;
  --display:"IM Fell English SC",Georgia,serif;
  --letterface:"IM Fell English",Georgia,serif;
  --body:"Spectral",Georgia,serif;
  --util:"Karla",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{color-scheme:dark;background:var(--ink)}
body{
  background:
    radial-gradient(ellipse 100% 55% at 50% -8%, rgba(110,18,25,.55), transparent 58%),
    radial-gradient(ellipse 70% 45% at 50% 110%, rgba(8,3,2,.95), transparent 60%),
    var(--ink);
  color:var(--parch);font-family:var(--body);font-weight:300;font-size:17px;line-height:1.6;
  min-height:100vh;-webkit-font-smoothing:antialiased
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1.2px 1.2px at 12% 18%,rgba(212,168,75,.55),transparent),
  radial-gradient(1px 1px at 78% 9%,rgba(240,226,196,.4),transparent),
  radial-gradient(1px 1px at 34% 62%,rgba(212,168,75,.28),transparent),
  radial-gradient(1.2px 1.2px at 89% 74%,rgba(240,226,196,.38),transparent),
  radial-gradient(1px 1px at 55% 33%,rgba(212,168,75,.22),transparent),
  radial-gradient(1px 1px at 22% 88%,rgba(240,226,196,.28),transparent),
  radial-gradient(1px 1px at 66% 51%,rgba(212,168,75,.18),transparent),
  radial-gradient(1.2px 1.2px at 5% 45%,rgba(240,226,196,.32),transparent)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.5) 100%)}
#wash{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  background:
    radial-gradient(100% 70% at 50% 0%,var(--house) 0%,transparent 58%),
    radial-gradient(60% 40% at 50% 100%,var(--house) 0%,transparent 55%);
  transition:opacity 1.6s ease}
#wash.on{opacity:.22}
.stage{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:88px 22px 90px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}

.eyebrow{font-family:var(--util);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,10.5vw,58px);line-height:1.02;margin:0 0 8px;color:var(--parch)}
.center{text-align:center}
.center .flourish{justify-content:center}
.sub{color:var(--dim);font-size:16px;margin:0 0 30px;font-style:italic;line-height:1.6}
.q{font-weight:400;font-size:clamp(19px,4.9vw,24px);line-height:1.4;margin:0 0 24px}

.candles{display:flex;justify-content:center;margin:0 0 28px;height:20px;align-items:flex-end;flex-wrap:wrap}
.grp{display:flex;gap:5px;align-items:flex-end;margin:0 7px}
.candle{width:4px;height:4px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--ink-3);transition:background .4s ease}
.candle.lit{background:var(--candle);box-shadow:0 0 6px rgba(212,168,75,.75)}
.candle.now{background:var(--candle);box-shadow:0 0 12px rgba(212,168,75,1);height:9px;animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1;transform:scaleY(1)}45%{opacity:.72;transform:scaleY(.82)}70%{opacity:.95;transform:scaleY(1.08)}}

.opt{display:block;width:100%;text-align:left;cursor:pointer;background:rgba(28,13,11,.88);color:var(--parch);border:1px solid rgba(201,162,39,.28);border-radius:2px;padding:14px 16px 14px 42px;margin:0 0 9px;position:relative;font-family:var(--body);font-weight:300;font-size:16.5px;line-height:1.45;transition:border-color .18s ease,background .18s ease,transform .12s ease,box-shadow .18s ease}
.opt::before{content:"";position:absolute;left:15px;top:19px;width:10px;height:10px;border-radius:50%;border:1px solid var(--candle-dim);transition:background .18s ease,box-shadow .18s ease}
.opt:hover,.opt:focus-visible{border-color:rgba(212,168,75,.55);background:var(--ink-3);outline:none;box-shadow:0 0 0 1px rgba(212,168,75,.12)}
.opt:hover::before,.opt:focus-visible::before{background:var(--wax);box-shadow:0 0 0 2px rgba(110,18,25,.45),0 0 8px rgba(201,162,39,.35)}
.opt:active{transform:scale(.995)}

.ghost{background:none;border:none;color:var(--dim);font-family:var(--util);font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:8px 2px}
.ghost:hover,.ghost:focus-visible{color:var(--candle);outline:none}
.seal-btn{display:inline-block;background:radial-gradient(circle at 30% 20%,var(--wax-lit),var(--wax) 68%);color:var(--parch);border:none;cursor:pointer;font-family:var(--util);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:15px 30px;border-radius:2px;box-shadow:0 1px 0 #4A0C10,0 8px 22px rgba(0,0,0,.45);transition:background .18s ease,transform .12s ease,box-shadow .18s ease}
.seal-btn:hover,.seal-btn:focus-visible{background:radial-gradient(circle at 30% 20%,#A8242C,var(--wax-lit) 70%);outline:none;box-shadow:0 1px 0 #4A0C10,0 10px 26px rgba(110,18,25,.45)}
.seal-btn:active{transform:scale(.98)}
.seal-btn.wide{width:100%}
.seal-btn.quiet{background:transparent;color:var(--dim);border:1px solid rgba(201,162,39,.28);box-shadow:none}
.seal-btn.quiet:hover{color:var(--parch);border-color:rgba(212,168,75,.55);background:transparent}

input[type=text]{width:100%;background:rgba(28,13,11,.88);border:1px solid rgba(201,162,39,.22);border-radius:2px;color:var(--parch);font-family:var(--body);font-size:18px;padding:14px 16px;margin:0 0 8px}
input[type=text]:focus{outline:none;border-color:var(--candle);box-shadow:0 0 0 3px rgba(201,162,39,.12)}
input[type=text]::placeholder{color:#7A684C}
.err{color:#E39A8A;font-family:var(--util);font-size:13px;margin:0 0 12px;min-height:18px}

.murmur{font-style:italic;font-size:19px;line-height:1.55;margin:0 0 16px;opacity:0}
.murmur.show{animation:rise .9s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:.92;transform:none}}

.house{font-family:var(--display);font-weight:400;font-size:clamp(40px,12.5vw,72px);line-height:1;margin:4px 0 10px;color:var(--house);text-shadow:0 0 28px rgba(201,162,39,.35)}
.house-line{font-size:17px;line-height:1.6;margin:0 0 30px;opacity:.9}
.reveal{animation:bloom 1.1s cubic-bezier(.16,.8,.3,1) forwards}
@keyframes bloom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.tally{border-top:1px solid var(--gold-soft);padding-top:22px;margin-top:8px}
.row{margin:0 0 15px}
.row-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--util);font-size:13px;letter-spacing:.06em}
.row-top .n{color:var(--dim)}
.track{height:3px;background:rgba(240,226,196,.1);margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.7,.3,1)}
.note{color:var(--dim);font-size:15.5px;font-style:italic;line-height:1.6;margin:20px 0 0}

.env-wrap{display:flex;flex-direction:column;align-items:center;text-align:center}
.envelope{position:relative;width:min(340px,88vw);aspect-ratio:1.6/1;background:
  linear-gradient(180deg,rgba(255,255,255,.08),transparent 30%),
  repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(90,70,30,.04) 18px,rgba(90,70,30,.04) 19px),
  var(--parch-deep);
  border-radius:3px;cursor:pointer;border:1px solid #C4A35A;padding:0;margin:8px 0 22px;
  box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 0 0 3px #EFE3C6}
.envelope::after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(160deg,rgba(0,0,0,.06),transparent 40%)}
.flap{position:absolute;top:0;left:0;right:0;height:56%;background:#D8C49A;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .9s cubic-bezier(.5,0,.4,1)}
.envelope.open .flap{transform:rotateX(160deg)}
.wax{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#A8242C,var(--wax) 62%);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;color:rgba(240,226,196,.92);box-shadow:inset 0 -3px 8px rgba(0,0,0,.35),0 0 0 3px rgba(201,162,39,.25),0 3px 10px rgba(0,0,0,.4);z-index:3;transition:transform .5s ease,opacity .5s ease}
.envelope.open .wax{transform:translate(-50%,-50%) scale(1.4) rotate(-14deg);opacity:0}
.addr{position:absolute;left:0;right:0;bottom:11%;font-family:var(--letterface);font-style:italic;font-size:15px;color:#3A3020;line-height:1.45;padding:0 14px;z-index:2}

.parchment{background:
  linear-gradient(180deg,rgba(255,255,255,.14),transparent 18%),
  var(--parch);
  color:#2B2418;border-radius:2px;border:1px solid #C4A35A;
  box-shadow:inset 0 0 0 5px #F3E6C8, inset 0 0 0 6px #C4A35A, 0 20px 60px rgba(0,0,0,.6)}
.letter{padding:34px 26px 30px;font-family:var(--letterface);font-size:17.5px;line-height:1.62;animation:bloom 1s cubic-bezier(.16,.8,.3,1) forwards}
.letter h2{font-family:var(--display);font-weight:400;font-size:23px;line-height:1.1;text-align:center;margin:0 0 2px;color:#2B2418}
.letter .crest{text-align:center;font-family:var(--letterface);font-style:italic;font-size:14px;color:#6B5C41;margin:0 0 4px}
.letter .rule{height:1px;background:linear-gradient(90deg,transparent,#B9A97F,transparent);margin:16px 0 20px}
.letter p{margin:0 0 15px}
.letter .sig{font-family:var(--display);font-size:19px;margin:22px 0 0}
.letter .sigrole{font-family:var(--letterface);font-style:italic;font-size:14px;color:#6B5C41;margin:2px 0 0}

.cert{padding:34px 24px 28px;text-align:center;font-family:var(--letterface)}
.cert .k{font-family:var(--util);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#7A6A4C;margin:0 0 18px}
.cert .who{font-family:var(--display);font-size:clamp(26px,7.5vw,36px);line-height:1.1;margin:0 0 14px}
.cert .mid{font-style:italic;font-size:16px;color:#5C4F38;margin:0 0 6px}
.cert .hs{font-family:var(--display);font-size:clamp(30px,9vw,44px);line-height:1;margin:0 0 18px;color:var(--house)}
.cert .why{font-size:15.5px;line-height:1.55;color:#3A3225;margin:0 auto 22px;max-width:380px}
.cert .stamp{width:88px;height:88px;border-radius:50%;background:var(--house);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:36px;color:rgba(255,255,255,.92);box-shadow:inset 0 -4px 10px rgba(0,0,0,.3),0 0 0 3px rgba(201,162,39,.35)}
.cert .date{font-family:var(--util);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7A6A4C}

.door{position:fixed;right:12px;bottom:12px;width:16px;height:16px;border-radius:50%;background:rgba(201,162,39,.12);border:none;cursor:pointer;z-index:5}
.door:hover,.door:focus-visible{background:rgba(212,168,75,.55);outline:none}
.panel{background:rgba(28,13,11,.92);border:1px solid var(--gold-soft);border-radius:2px;padding:22px}
.code{font-family:var(--util);font-size:clamp(22px,7vw,30px);letter-spacing:.18em;color:var(--candle);text-align:center;background:var(--ink);padding:16px;border-radius:2px;margin:6px 0 4px;word-break:break-all;border:1px solid rgba(201,162,39,.18)}
.warn{font-family:var(--util);font-size:12px;letter-spacing:.06em;color:#E39A8A;margin:0 0 16px}
.stack > *{margin-bottom:10px}
.stack > *:last-child{margin-bottom:0}
.copied{font-family:var(--util);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--candle);text-align:center;min-height:18px;margin:0 0 4px}

#hall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#hall::before{content:"";position:absolute;left:0;right:0;top:0;height:210px;background:radial-gradient(ellipse 90% 100% at 50% 0%,rgba(212,168,75,.16),transparent 72%)}
#stars i{position:absolute;border-radius:50%;background:#F3E6C8;box-shadow:0 0 6px rgba(212,168,75,.8);animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
#motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(212,168,75,.75);box-shadow:0 0 8px rgba(212,168,75,.7);animation:mote 14s linear infinite}
@keyframes mote{0%{transform:translateY(12vh) scale(.6);opacity:0}12%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-110vh) scale(1);opacity:0}}
.fcandle{position:absolute;width:22px;display:flex;flex-direction:column;align-items:center;animation:hover-c 6.5s ease-in-out infinite;transform-origin:top center}
.fcandle .halo{position:absolute;top:-14px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,rgba(232,184,75,.42),transparent 68%);pointer-events:none}
.fcandle .flame{position:relative;z-index:1;width:11px;height:18px;border-radius:50% 50% 45% 45%/60% 60% 38% 38%;background:radial-gradient(circle at 40% 28%,#FFF8D2 0%,#F0C14B 48%,#E07A2F 100%);box-shadow:0 0 10px rgba(255,220,120,.95),0 0 22px rgba(232,184,75,.55);animation:flicker 1.5s ease-in-out infinite}
.fcandle .wick{width:2px;height:5px;background:#3A2414;border-radius:1px;margin-bottom:-1px}
.fcandle .stem{width:13px;height:var(--len,56px);background:linear-gradient(90deg,#8A7038,#F0E2C4 38%,#D4B896 62%,#9A7840);border-radius:2px 2px 1px 1px;box-shadow:2px 6px 14px rgba(0,0,0,.45);position:relative}
.fcandle .stem::after{content:"";position:absolute;right:1px;top:38%;width:4px;height:11px;background:#E8D5A3;border-radius:0 0 3px 3px;opacity:.9}
@keyframes hover-c{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-8px) rotate(1.6deg)}}
#sparks{position:fixed;inset:0;z-index:4;pointer-events:none}
#sparks i{position:absolute;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--candle);box-shadow:0 0 8px currentColor;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.flourish{display:flex;align-items:center;gap:10px;margin:4px 0 22px;opacity:.75}
.flourish i{display:block;height:1px;width:54px;background:linear-gradient(90deg,transparent,var(--candle),transparent);box-shadow:0 0 8px rgba(212,168,75,.35)}
.flourish b{width:9px;height:9px;border:1px solid var(--candle);transform:rotate(45deg);box-shadow:0 0 8px rgba(212,168,75,.4)}
.stage.arrive{animation:arrive .7s cubic-bezier(.16,.8,.3,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.seal-mark{width:86px;height:86px;border-radius:50%;margin:8px auto 22px;background:radial-gradient(circle at 35% 30%,#A8242C,var(--wax) 62%);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;color:rgba(240,226,196,.92);box-shadow:inset 0 -3px 8px rgba(0,0,0,.35),0 0 0 3px rgba(201,162,39,.28),0 0 24px rgba(110,18,25,.45);animation:sealpulse 2.8s ease-in-out infinite}
@keyframes sealpulse{0%,100%{box-shadow:inset 0 -3px 8px rgba(0,0,0,.35),0 0 0 3px rgba(201,162,39,.22),0 0 18px rgba(110,18,25,.35)}50%{box-shadow:inset 0 -3px 8px rgba(0,0,0,.35),0 0 0 5px rgba(201,162,39,.4),0 0 32px rgba(201,162,39,.35)}}

.hat-think{text-align:center}
.hat-glow{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(212,168,75,.35),transparent 68%);animation:hatglow 2.2s ease-in-out infinite;display:flex;align-items:flex-end;justify-content:center}
.hat-glow svg{width:72px;height:72px;filter:drop-shadow(0 0 10px rgba(212,168,75,.55))}
@keyframes hatglow{0%,100%{transform:scale(.96);opacity:.75}50%{transform:scale(1.06);opacity:1}}
.runes{display:flex;justify-content:center;gap:14px;margin:0 0 22px;font-family:var(--display);font-size:15px;letter-spacing:.28em;color:var(--candle);opacity:.55}
.runes span{animation:rune 2.4s ease-in-out infinite}
.runes span:nth-child(2){animation-delay:.3s}
.runes span:nth-child(3){animation-delay:.6s}
.runes span:nth-child(4){animation-delay:.9s}
@keyframes rune{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.9;transform:translateY(-3px)}}
.hat-think .murmur{text-align:left}

.envelope{animation:floatenv 4.5s ease-in-out infinite}
.envelope:hover,.envelope:focus-visible{box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 0 0 3px #EFE3C6, 0 0 28px rgba(201,162,39,.35)}
@keyframes floatenv{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.envelope.open{animation:none}
.wax{animation:sealpulse 2.8s ease-in-out infinite}

.letter p{animation:ink .9s ease both}
.letter p:nth-of-type(1){animation-delay:.05s}
.letter p:nth-of-type(2){animation-delay:.16s}
.letter p:nth-of-type(3){animation-delay:.28s}
.letter p:nth-of-type(4){animation-delay:.4s}
.letter p:nth-of-type(5){animation-delay:.52s}
.letter p:nth-of-type(6){animation-delay:.64s}
.letter p:nth-of-type(7){animation-delay:.76s}
@keyframes ink{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.house{animation:housename 1.4s cubic-bezier(.16,.8,.3,1) both}
@keyframes housename{from{opacity:0;letter-spacing:.12em;filter:blur(4px)}to{opacity:1;letter-spacing:0;filter:none}}
.cert .stamp{animation:stampin .7s cubic-bezier(.2,.8,.3,1) .3s both}
@keyframes stampin{from{transform:scale(1.35) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

.opt{overflow:hidden}
.opt::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(212,168,75,.08) 50%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.opt:hover::after,.opt:focus-visible::after{animation:sheen .7s ease}
@keyframes sheen{to{transform:translateX(120%)}}

body.mood-hat{--ink:#160A08}
body.mood-reveal #hall .fcandle .flame{box-shadow:0 0 16px var(--house),0 0 36px var(--house)}

@media (max-width:720px){.fcandle{transform:scale(.72)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .murmur{opacity:.92}#wash.on{opacity:.22}
  .letter p,.stage.arrive,.house,.cert .stamp{opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>
<div id="hall" aria-hidden="true">
  <div id="stars"></div>
  <div id="float-candles"></div>
  <div id="motes"></div>
</div>
<div id="wash"></div>
<div id="sparks" aria-hidden="true"></div>
<main class="stage" id="stage" aria-live="polite"></main>
<button class="door" id="door" aria-label="Keeper"></button>

<script>
/* ─────────────────────────────────────────────
   EDIT THESE FIVE LINES AND NOTHING ELSE
   The keeper word is visible if someone views
   the page source — change it before you publish.
   ───────────────────────────────────────────── */
var CONFIG = {
  student:    "Rosie",
  revealDate: "2026-09-03",
  address:    "The bedroom at the top of the stairs",
  signedBy:   "Prof. E. Whitlock",

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function pad2(n){var s=Math.max(0,Math.min(1295,Math.round(n))).toString(36);return s.length<2?"0"+s:s}
function encode(h,sc){
  var raw=String(ORDER.indexOf(h))+pad2(sc.G)+pad2(sc.H)+pad2(sc.R)+pad2(sc.S),out="";
  for(var i=0;i<raw.length;i++){out+=SUB.charAt(STD.indexOf(raw.charAt(i)))}

}
function decode(str){
  var c=(str||"").toLowerCase().replace(/[^a-z0-9]/g,""),raw="";
  if(c.length!==9)return null;
  for(var i=0;i<9;i++){var k=SUB.indexOf(c.charAt(i));if(k<0)return null;raw+=STD.charAt(k)}
  var h=ORDER[parseInt(raw.charAt(0),10)];if(!h)return null;
  return {h:h,sc:{G:parseInt(raw.substr(1,2),36),H:parseInt(raw.substr(3,2),36),
                  R:parseInt(raw.substr(5,2),36),S:parseInt(raw.substr(7,2),36)}};
}

  try{

       typeof o.score.R!=="number" || typeof o.score.S!=="number") return null;
    o.picks=o.picks||{G:0,H:0,R:0,S:0};

function itsTime(){var s=load();return (s&&s.unsealed===true)||daysLeft()<=0}

  p=p||{G:0,H:0,R:0,S:0};
  var order=ORDER.slice().sort(function(a,b){return (s[b]-s[a])||(p[b]-p[a])||ORDER.indexOf(a)-ORDER.indexOf(b)});
  if(winner && ORDER.indexOf(winner)>=0){
    order=[winner].concat(order.filter(function(h){return h!==winner}));

  for(var j=0;j<os.length;j++){os[j].onclick=function(){choose(parseInt(this.getAttribute("data-i"),10))}}
  var b=document.getElementById("back");
  if(b)b.onclick=function(){
    var l=trail.pop();
    for(var k in l.s){score[k]-=l.s[k]*l.w}
    if(l.top)picks[l.top]--;
    idx--;question();
  };
}

function choose(i){
  var it=QUESTIONS[idx],w=MOVEMENTS[it.m].w,s=deck[idx][i][1],top=null,best=0;
  for(var k in s){if(s[k]>best){best=s[k];top=k}}
  var btn=stage.querySelector('.opt[data-i="'+i+'"]');
  if(btn){
    var box=btn.getBoundingClientRect();
    burst(box.left+box.width*0.12,box.top+box.height/2,(top&&HOUSES[top].c)||"#D4A84B",14);
  }
  chime("tap");
  for(var k in s){score[k]+=s[k]*w}
  if(top)picks[top]++;
  trail.push({s:s,top:top,w:w});
  idx++;
  var next=QUESTIONS[idx];
  if(next && next.m!==it.m) return interstitial(next.m);
  question();
}

function sealIt(){
  var r=ranked(score,picks);
  save({name:name_,score:score,picks:picks,house:r[0],done:false,unsealed:false,when:Date.now()});
  var d=daysLeft();
  chime("seal");burstCenter("#C9A227",26);
  paint(
   '<div class="center"><p class="eyebrow">Sealed</p><h1>Not a word</h1>'+flourish()+
   '<div class="seal-mark" aria-hidden="true">H</div>'+
   '<p class="sub">The Hat has read all twenty-seven answers and made up its mind. It is now refusing to speak, which it does with enormous satisfaction.</p>'+
   '<p style="font-size:18px;line-height:1.6;margin:0 0 26px">Come back on <strong style="color:var(--candle);font-weight:400">'+
     revealDay().toLocaleDateString(undefined,{day:"numeric",month:"long"})+'</strong>'+
     (d>0?', in '+d+' day'+(d===1?"":"s")+',':'')+' and it will tell you where you belong.</p>'+
   '<p class="eyebrow" style="margin:0">Close this page. Nothing more happens today.</p></div>');
}
function holding(s){
  var d=daysLeft();
  paint(
   '<div class="center"><p class="eyebrow">Sealed</p><h1>Still waiting</h1>'+flourish()+
   '<div class="seal-mark" aria-hidden="true">H</div>'+
   '<p class="sub">The Hat has your answers, '+esc(s.name)+', and it is not budging.</p>'+
   '<p style="font-size:20px;margin:0 0 30px"><strong style="color:var(--candle);font-weight:400">'+d+' day'+(d===1?"":"s")+'</strong> until it speaks.</p>'+
   '<button class="ghost" id="codebtn">I have a sorting code</button></div>');
  document.getElementById("codebtn").onclick=codeEntry;
}

function envelope(s){
  document.getElementById("wash").classList.remove("on");
  paint(
   '<div class="env-wrap"><p class="eyebrow">Something arrived for you</p>'+flourish()+
   '<button class="envelope" id="env" aria-label="Break the seal and open the letter">'+
   '<span class="flap"></span><span class="wax">H</span>'+
   '<span class="addr">'+esc(s.name)+'<br>'+esc(CONFIG.address)+'</span></button>'+
   '<p class="eyebrow" style="margin:0">Tap the seal</p></div>');
  document.getElementById("env").onclick=function(){
    this.classList.add("open");this.disabled=true;
    chime("letter");
    var r=this.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2,"#C11F2A",22);
    setTimeout(function(){letter(s)},1000);
  };
}
function letter(s){
  paint(
   '<div class="letter parchment"><h2>Hogwarts School</h2>'+
   '<p class="crest">of Witchcraft and Wizardry</p><div class="rule"></div>'+
   '<p>Dear Miss '+esc(s.name)+',</p>'+
   '<p>We have been watching these last eleven years with a good deal of interest, and we are satisfied.</p>'+
   '<p>A place has been kept for you here since the night you were born, written in a ledger that keeps itself, and this morning your name came up in fresh ink. It is a very fine name and it sits well on the page.</p>'+
   '<p>Term begins whenever you are ready. Bring warm socks, a curious mind, and nothing you would be afraid to lose. You will be met at the gates.</p>'+
   '<p>One matter remains before anything else can be settled. The Hat has already read your answers &mdash; all twenty-seven of them &mdash; and has been holding its tongue since August, which it does not enjoy and has mentioned to us more than once. It would like a word.</p>'+
   '<p class="sig">'+esc(CONFIG.signedBy)+'</p>'+
   '<p class="sigrole">Deputy Headmistress</p></div>'+
   '<p style="margin-top:26px;text-align:center"><button class="seal-btn" id="toHat">Present yourself to the Hat</button></p>');
  chime("letter");
  document.getElementById("toHat").onclick=function(){chime("tap");deliberate(s)};
}

function deliberate(s){
  var r=ranked(s.score,s.picks,s.house);
  var lines=["Hmm. "+s.name+". Let me have a proper look at you.",
             HOUSES[r[0]].loud,HOUSES[r[1]].quiet,"Yes. I think that settles it."];
  var h='<div class="hat-think"><p class="eyebrow">The Hat is thinking</p>'+
        '<div class="hat-glow">'+hatSvg()+'</div>'+
        '<div class="runes" aria-hidden="true"><span>&#10022;</span><span>&#10023;</span><span>&#10022;</span><span>&#10023;</span></div>';
  for(var i=0;i<lines.length;i++){h+='<p class="murmur" id="m'+i+'">'+esc(lines[i])+'</p>'}
  h+='</div>';
  paint(h);
  document.body.classList.add("mood-hat");
  chime("seal");
  lines.forEach(function(_,i){setTimeout(function(){
    var el=document.getElementById("m"+i);if(el)el.classList.add("show");
    if(el)burst(window.innerWidth/2,el.getBoundingClientRect().top, "#D4A84B",8);
  },300+i*1600)});
  setTimeout(function(){reveal(s)},300+lines.length*1600+800);
}
function reveal(s){
  var r=ranked(s.score,s.picks,s.house),win=HOUSES[r[0]];
  var total=s.score.G+s.score.H+s.score.R+s.score.S||1;
  document.documentElement.style.setProperty("--house",win.c);
  document.getElementById("wash").classList.add("on");
  var h='<div class="reveal"><p class="eyebrow">'+esc(s.name)+', the Hat has decided</p>'+flourish()+
        '<p class="house">'+win.name+'</p><p class="house-line">'+win.line+'</p>'+
        '<div class="tally"><p class="eyebrow">How close it was</p>';
  for(var i=0;i<r.length;i++){var k=r[i],p=Math.round(s.score[k]/total*100);
    h+='<div class="row"><div class="row-top"><span>'+HOUSES[k].name+'</span><span class="n">'+p+'%</span></div>'+
       '<div class="track"><i data-w="'+p+'" style="background:'+HOUSES[k].c+'"></i></div></div>'}
  h+='</div>';
  var gap=s.score[r[0]]-s.score[r[1]];
  if(gap<=4){h+='<p class="note">A hatstall. '+HOUSES[r[0]].name+' and '+HOUSES[r[1]].name+
    ' came within a whisker of each other, and the Hat had to weigh your own leanings to break the tie.</p>'}
  else if(gap>=20){h+='<p class="note">No hesitation at all. The Hat knew by the second movement and spent the rest of it enjoying itself.</p>'}
  h+='<p style="margin-top:30px"><button class="seal-btn wide" id="toCert">Receive your certificate</button></p></div>';
  paint(h);
  document.body.classList.add("mood-reveal");
  chime("reveal");
  burstCenter(win.c,36);
  setTimeout(function(){var b=stage.querySelectorAll(".track i");
    for(var i=0;i<b.length;i++){b[i].style.width=b[i].getAttribute("data-w")+"%"}},120);
  document.getElementById("toCert").onclick=function(){
    if(!PREVIEW){s.done=true;s.day=longDate();save(s)}
    certificate(s,false)};
}
function certificate(s,returning){
  var r=ranked(s.score,s.picks,s.house),win=HOUSES[r[0]];
  document.documentElement.style.setProperty("--house",win.c);
  document.getElementById("wash").classList.add("on");
  paint(
   '<div class="reveal"><div class="cert parchment">'+
   '<p class="k">Hogwarts School of Witchcraft and Wizardry</p>'+
   '<p class="who">'+esc(s.name)+'</p><p class="mid">has been sorted into</p>'+
   '<p class="hs">'+win.name+'</p><p class="why">'+win.cert+'</p>'+
   '<div class="stamp">'+win.mark+'</div>'+
   '<p class="date">Sorted '+esc(s.day||longDate())+'</p></div>'+
   '<p class="eyebrow" style="text-align:center;margin:20px 0 0">Screenshot this &mdash; it is the only copy</p>'+
   (returning?'<p style="text-align:center;margin-top:18px"><button class="ghost" id="replay">Watch the ceremony again</button></p>':'')+
   '</div>');
  document.body.classList.add("mood-reveal");
  burstCenter(win.c,20);
  var rp=document.getElementById("replay");
  if(rp)rp.onclick=function(){document.getElementById("wash").classList.remove("on");deliberate(s)};
}

function codeEntry(){
  paint(
   '<p class="eyebrow">Sorting code</p><h1>Nine letters</h1>'+flourish()+
   '<p class="sub">If the Hat did its reading on another device, type the code here.</p>'+
   '<input type="text" id="code" placeholder="ABC-DEF-GHI" autocomplete="off" spellcheck="false">'+
   '<p class="err" id="err"></p>'+
   '<div class="stack"><button class="seal-btn wide" id="use">Restore the sorting</button>'+
   '<button class="seal-btn quiet wide" id="cancel">Back</button></div>');
  var inp=document.getElementById("code"),err=document.getElementById("err");
  inp.addEventListener("input",function(){err.textContent=""});
  document.getElementById("cancel").onclick=route;
  document.getElementById("use").onclick=function(){
    var d=decode(inp.value);
    if(!d){err.textContent="That code is not one of ours. Check it and try again.";return}
    save({name:CONFIG.student,score:d.sc,picks:{G:0,H:0,R:0,S:0},house:d.h,done:false,unsealed:false,when:Date.now()});
    route();
  };
  inp.focus();
}

document.getElementById("door").onclick=function(){
  var s=load();
  if(!s){paint('<p class="eyebrow">Keeper</p><h1>Nothing sealed</h1>'+flourish()+
    '<p class="sub">Nobody has been sorted on this device yet.</p>'+
    '<div class="stack"><button class="seal-btn wide" id="k1">Start the ceremony</button>'+
    '<button class="seal-btn quiet wide" id="k2">Enter a sorting code</button></div>');
    document.getElementById("k1").onclick=welcome;
    document.getElementById("k2").onclick=codeEntry;return}
  paint('<p class="eyebrow">Keeper</p><h1>Say the word</h1>'+flourish()+
    '<input type="text" id="pw" placeholder="Passphrase" autocomplete="off">'+
    '<p class="err" id="err"></p>'+
    '<div class="stack"><button class="seal-btn wide" id="ok">Enter</button>'+
    '<button class="seal-btn quiet wide" id="no">Back</button></div>');
  var pw=document.getElementById("pw"),err=document.getElementById("err");
  pw.addEventListener("input",function(){err.textContent=""});
  pw.addEventListener("keydown",function(e){if(e.key==="Enter")go()});
  document.getElementById("ok").onclick=go;
  document.getElementById("no").onclick=route;
  pw.focus();
  function go(){
    if(pw.value.trim().toLowerCase()!==CONFIG.keeperWord.toLowerCase()){err.textContent="Not the word.";return}
    keeper(s);
  }
};
function keeper(s){
  var r=ranked(s.score,s.picks,s.house),total=s.score.G+s.score.H+s.score.R+s.score.S||1;
  var h='<p class="eyebrow">Keeper &mdash; for your eyes</p><p class="warn">Do not leave this screen open.</p>'+
        '<div class="panel"><p class="eyebrow" style="margin-bottom:6px">'+esc(s.name)+' was sorted into</p>'+
        '<p style="font-family:var(--display);font-size:34px;line-height:1;margin:0 0 18px;color:'+HOUSES[r[0]].c+'">'+HOUSES[r[0]].name+'</p>';
  for(var i=0;i<r.length;i++){var k=r[i],p=Math.round(s.score[k]/total*100);
    h+='<div class="row"><div class="row-top"><span>'+HOUSES[k].name+'</span><span class="n">'+p+'%</span></div>'+
       '<div class="track"><i style="width:'+p+'%;background:'+HOUSES[k].c+'"></i></div></div>'}
  h+='<p class="eyebrow" style="margin:22px 0 0">Sorting code &mdash; write this down</p>'+
     '<p class="code" id="sortcode">'+encode(r[0],s.score)+'</p>'+
     '<p class="copied" id="copied"></p>'+
     '<button class="ghost" id="copycode" style="display:block;width:100%;text-align:center">Copy the code</button>'+
     '<p class="eyebrow" style="margin:8px 0 0">Restores the result on any other device</p></div>'+
     '<div class="stack" style="margin-top:18px">'+
     '<button class="seal-btn wide" id="prev">Preview the whole ceremony</button>'+
     '<button class="seal-btn quiet wide" id="unseal">'+(s.unsealed?"Re-seal until the day":"Unseal it now")+'</button>'+
     '<button class="seal-btn quiet wide" id="clear">Erase and start over</button>'+
     '<button class="ghost" id="out" style="display:block;width:100%;text-align:center">Back to the sealed screen</button></div>';
  paint(h);
  document.getElementById("copycode").onclick=function(){
    copyText(document.getElementById("sortcode").textContent,function(){
      document.getElementById("copied").textContent="Copied — keep it somewhere she will not see.";
    });
  };
  document.getElementById("prev").onclick=function(){PREVIEW=true;envelope(s)};
  document.getElementById("unseal").onclick=function(){s.unsealed=!s.unsealed;save(s);keeper(s)};
  document.getElementById("clear").onclick=function(){
    if(confirm("Erase the sorting completely? This cannot be undone."))
    {wipe();document.getElementById("wash").classList.remove("on");welcome()}};
  document.getElementById("out").onclick=route;
}

enchantHall();
route();
</script>
</body>
</html>
